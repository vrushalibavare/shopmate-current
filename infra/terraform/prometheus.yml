global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'shopmate-dev'
    static_configs:
      - targets: ['shopmate.dev.sctp-sandbox.com']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scheme: https
    
  - job_name: 'shopmate-uat'
    static_configs:
      - targets: ['shopmate.uat.sctp-sandbox.com']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scheme: https
    
  - job_name: 'shopmate-prod'
    static_configs:
      - targets: ['shopmate.sctp-sandbox.com']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scheme: https