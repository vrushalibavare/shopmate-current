global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'shopmate'
    static_configs:
      - targets: ['shopmate.shopmate-dev.local:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s