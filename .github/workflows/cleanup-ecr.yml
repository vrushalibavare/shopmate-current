name: Cleanup ECR Repository

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Cleanup action'
        required: true
        type: choice
        options:
          - cleanup-images
          - delete-repository
      confirm:
        description: 'Type "CLEANUP" to confirm'
        required: true
        type: string

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: shopmate

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CLEANUP'
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Cleanup ECR Images
      if: github.event.inputs.action == 'cleanup-images'
      run: |
        echo "🧹 Cleaning up old ECR images (keeping latest 10)..."
        
        # Get all images sorted by push date (oldest first)
        OLD_IMAGES=$(aws ecr describe-images \
          --repository-name $ECR_REPOSITORY \
          --region $AWS_REGION \
          --query 'sort_by(imageDetails,&imagePushedAt)[:-10].[imageDigest,imageTags[0]]' \
          --output json)
        
        if [ "$OLD_IMAGES" != "[]" ] && [ "$OLD_IMAGES" != "null" ]; then
          echo "Found $(echo $OLD_IMAGES | jq length) old images to delete"
          
          # Convert to format needed for batch-delete-image
          IMAGE_IDS=$(echo $OLD_IMAGES | jq 'map({imageDigest: .[0]})')
          
          # Delete old images
          aws ecr batch-delete-image \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION \
            --image-ids "$IMAGE_IDS"
          
          echo "✅ Old ECR images cleaned up (kept latest 10)"
        else
          echo "ℹ️ No old images to clean up (less than 10 images total)"
        fi

    - name: Delete ECR Repository
      if: github.event.inputs.action == 'delete-repository'
      run: |
        echo "🗑️ Deleting ECR repository and all images..."
        aws ecr delete-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION --force
        echo "✅ ECR repository deleted completely"

    - name: Summary
      run: |
        if [ "${{ github.event.inputs.action }}" == "cleanup-images" ]; then
          echo "✅ ECR images cleaned up (kept latest 5)"
        else
          echo "✅ ECR repository deleted completely"
          echo "⚠️ All environments will need to rebuild images on next deployment"
        fi