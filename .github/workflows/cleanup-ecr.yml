name: Cleanup ECR Repository

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Cleanup action'
        required: true
        type: choice
        options:
          - cleanup-images
          - delete-repository
      confirm:
        description: 'Type "CLEANUP" to confirm'
        required: true
        type: string

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: shopmate

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CLEANUP'
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Cleanup ECR Images
      if: github.event.inputs.action == 'cleanup-images'
      run: |
        echo "🧹 Cleaning up old ECR images..."
        aws ecr list-images --repository-name $ECR_REPOSITORY --region $AWS_REGION --query 'imageIds[*]' --output json > images.json
        if [ -s images.json ] && [ "$(cat images.json)" != "[]" ]; then
          # Keep latest 5 images, delete the rest
          aws ecr describe-images --repository-name $ECR_REPOSITORY --region $AWS_REGION \
            --query 'sort_by(imageDetails,&imagePushedAt)[:-5].imageDigest' --output json > old_images.json
          if [ -s old_images.json ] && [ "$(cat old_images.json)" != "[]" ]; then
            aws ecr batch-delete-image --repository-name $ECR_REPOSITORY --region $AWS_REGION \
              --image-ids "$(cat old_images.json | jq 'map({imageDigest: .})')"
            echo "✅ Old ECR images cleaned up"
          else
            echo "ℹ️ No old images to clean up"
          fi
        else
          echo "ℹ️ No ECR images found"
        fi

    - name: Delete ECR Repository
      if: github.event.inputs.action == 'delete-repository'
      run: |
        echo "🗑️ Deleting ECR repository and all images..."
        aws ecr delete-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION --force
        echo "✅ ECR repository deleted completely"

    - name: Summary
      run: |
        if [ "${{ github.event.inputs.action }}" == "cleanup-images" ]; then
          echo "✅ ECR images cleaned up (kept latest 5)"
        else
          echo "✅ ECR repository deleted completely"
          echo "⚠️ All environments will need to rebuild images on next deployment"
        fi