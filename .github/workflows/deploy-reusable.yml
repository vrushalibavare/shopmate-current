# ============================================================================
# REUSABLE DEPLOYMENT WORKFLOW
# ============================================================================
# This reusable workflow handles deployment for STAGE and PRODUCTION environments
# 
# Purpose:
# - Eliminates code duplication between stage.yml and production.yml
# - Provides consistent deployment logic across environments
# - Uses secure backend configuration from Parameter Store
# 
# Used by:
# - stage.yml (uat environment, dev → stage promotion)
# - production.yml (prod environment, stage → production promotion)
# 
# NOT used by:
# - dev.yml (has unique CI/CD features: image building, security scans, Node.js audit)
# 
# Key Features:
# - Validates source branch (enforces promotion flow)
# - Uses existing prod-latest image (built in dev workflow)
# - Applies GitHub environment protection (staging/production)
# - Fetches backend config securely from Parameter Store
# - Deploys using secure distroless images with debug capabilities
# ============================================================================

name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment to deploy to (uat/prod)'
      source_branch:
        required: true
        type: string
        description: 'Expected source branch (dev/stage)'
      target_branch:
        required: true
        type: string
        description: 'Target branch (stage/production)'
      github_environment:
        required: true
        type: string
        description: 'GitHub environment for approvals (staging/production)'

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: shopmate

jobs:
  check-source:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.target_branch && github.event.pull_request.head.ref == inputs.source_branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        run: echo "PR from ${{ inputs.source_branch }} to ${{ inputs.target_branch }} approved"

  validate:
    needs: check-source
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Validate environment
      run: |
        echo "Validating ${{ inputs.environment }} environment..."
        if [[ ! -f "infra/terraform/terraform.tfvars.${{ inputs.environment }}" ]]; then
          echo "❌ Missing terraform.tfvars.${{ inputs.environment }} file"
          exit 1
        fi
        aws sts get-caller-identity
        echo "✅ ${{ inputs.environment }} environment validation passed"

    - name: Get backend configurations from Parameter Store
      run: |
        echo "🔐 Fetching secure backend configurations..."
        aws ssm get-parameter \
          --name "/terraform/backend/shopmate" \
          --with-decryption \
          --query "Parameter.Value" \
          --output text > infra/terraform/backend.hcl
        
        aws ssm get-parameter \
          --name "/terraform/backend/shopmate-shared" \
          --with-decryption \
          --query "Parameter.Value" \
          --output text > infra/terraform/shared/backend.hcl
        
        echo "✅ Backend configurations retrieved securely"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Terraform Format Check (Main)
      working-directory: infra/terraform
      run: terraform fmt -check

    - name: Terraform Format Check (Shared)
      working-directory: infra/terraform/shared
      run: terraform fmt -check

    - name: Terraform Init (Main)
      working-directory: infra/terraform
      run: terraform init -reconfigure -backend-config=backend.hcl

    - name: Terraform Init (Shared)
      working-directory: infra/terraform/shared
      run: terraform init -reconfigure -backend-config=backend.hcl

    - name: Terraform Validate (Main)
      working-directory: infra/terraform
      run: terraform validate

    - name: Terraform Validate (Shared)
      working-directory: infra/terraform/shared
      run: terraform validate

    - name: Terraform Plan
      working-directory: infra/terraform
      run: |
        terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}
        terraform plan -var-file="terraform.tfvars.${{ inputs.environment }}"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Get backend configurations from Parameter Store
      run: |
        echo "🔐 Fetching secure backend configurations..."
        aws ssm get-parameter \
          --name "/terraform/backend/shopmate" \
          --with-decryption \
          --query "Parameter.Value" \
          --output text > infra/terraform/backend.hcl
        
        aws ssm get-parameter \
          --name "/terraform/backend/shopmate-shared" \
          --with-decryption \
          --query "Parameter.Value" \
          --output text > infra/terraform/shared/backend.hcl
        
        echo "✅ Backend configurations retrieved securely"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Validate production image exists
      run: |
        echo "🔒 Validating production image exists for ${{ inputs.environment }} deployment..."
        if ! aws ecr describe-images --repository-name shopmate --image-ids imageTag=prod-latest --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          echo "❌ Production image 'prod-latest' not found. Please run deployment on 'dev' environment first."
          exit 1
        fi
        echo "✅ Production image found, using secure distroless image"

    - name: Deploy shared infrastructure first
      working-directory: infra/terraform/shared
      run: |
        terraform init -reconfigure -backend-config=backend.hcl
        terraform apply -auto-approve

    - name: Deploy with Terraform (use secure prod image)
      working-directory: infra/terraform
      run: |
        terraform init -reconfigure -backend-config=backend.hcl
        terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}
        terraform apply -var-file="terraform.tfvars.${{ inputs.environment }}" -auto-approve
        echo "✅ ${{ inputs.environment }} deployed using prod-latest image (source: ${{ github.sha }})"
        echo "🔒 Using secure distroless image with debug capabilities"

    - name: Force ECS service updates
      run: |
        cd infra/terraform
        terraform workspace select ${{ inputs.environment }}
        CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
        MAIN_SERVICE=$(terraform output -raw main_service_name)
        PROMETHEUS_SERVICE=$(terraform output -raw prometheus_service_name)
        GRAFANA_SERVICE=$(terraform output -raw grafana_service_name)
        
        # Update main application service
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service $MAIN_SERVICE \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}
        
        # Update Prometheus service if it exists
        if aws ecs describe-services --cluster $CLUSTER_NAME --services $PROMETHEUS_SERVICE --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $PROMETHEUS_SERVICE \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
        fi
        
        # Update Grafana service if it exists
        if aws ecs describe-services --cluster $CLUSTER_NAME --services $GRAFANA_SERVICE --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $GRAFANA_SERVICE \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
        fi

    - name: Get deployment URLs
      working-directory: infra/terraform
      run: |
        terraform workspace select ${{ inputs.environment }}
        echo "✅ ${{ inputs.environment }} deployment completed successfully!"
        echo "🌐 Application URL: $(terraform output -raw application_url)"
        echo "📊 CloudWatch Dashboard: $(terraform output -raw cloudwatch_dashboard_url)"
        echo "📈 Grafana Dashboard: $(terraform output -raw grafana_url)"
        echo "🔍 Prometheus Metrics: $(terraform output -raw prometheus_url)"
        echo "📷 Source commit: ${{ github.sha }}"
        echo "🔒 Using prod-latest image (secure distroless with debug capabilities)"