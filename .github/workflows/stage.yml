# ============================================================================
# STAGING DEPLOYMENT WORKFLOW
# ============================================================================
# This workflow deploys to the UAT (staging) environment using the reusable workflow
# 
# Purpose:
# - Promotes code from dev → stage branch
# - Uses existing prod-latest image (built in dev workflow)
# - Applies GitHub environment protection for staging approvals
# - Uses secure distroless image with debug capabilities
# 
# Triggered by: PR merge from dev to stage branch
# Reusable workflow: deploy-reusable.yml
# Environment: uat (User Acceptance Testing)
# Backend config: Fetched securely from Parameter Store
# ============================================================================

name: Deploy to Staging

on:
  pull_request:
    branches: [ stage ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: uat
      source_branch: dev
      target_branch: stage
      github_environment: staging
    secrets: inherit