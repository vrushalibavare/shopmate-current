name: Deploy Prometheus Updates

on:
  push:
    branches: [ dev ]
    paths:
      - 'infra/terraform/prometheus.yml'
      - 'infra/Dockerfile.prometheus'
      - 'infra/monitoring/**'

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: shopmate

jobs:
  deploy-prometheus:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Prometheus image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker buildx build --platform=linux/amd64 -f infra/Dockerfile.prometheus -t $ECR_REGISTRY/$ECR_REPOSITORY:prometheus .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:prometheus

    - name: Force ECS service update
      run: |
        aws ecs update-service --cluster shopmate-dev --service prometheus-dev --force-new-deployment --region ${{ env.AWS_REGION }}
        echo "✅ Prometheus deployment completed successfully!"
        echo "🔍 Prometheus will be available at: https://shopmate.dev.sctp-sandbox.com/prometheus"