name: Deploy to Development

on:
  pull_request:
    branches: [ dev ]
    types: [ closed ]

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: shopmate
  ENVIRONMENT: dev

jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Terraform Format Check (Main)
      working-directory: infra/terraform
      run: terraform fmt -check

    - name: Terraform Format Check (Shared)
      working-directory: infra/terraform/shared
      run: terraform fmt -check

    - name: Terraform Init (Main)
      working-directory: infra/terraform
      run: terraform init -reconfigure

    - name: Terraform Init (Shared)
      working-directory: infra/terraform/shared
      run: terraform init -reconfigure

    - name: Terraform Validate (Main)
      working-directory: infra/terraform
      run: terraform validate

    - name: Terraform Validate (Shared)
      working-directory: infra/terraform/shared
      run: terraform validate

    - name: Terraform Security Scan
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: infra/terraform
        soft_fail: true
        additional_args: --minimum-severity HIGH

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      working-directory: app
      run: npm ci

    - name: Node.js Security Audit
      working-directory: app
      run: |
        npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found - review required"

    - name: Terraform Plan
      working-directory: infra/terraform
      run: |
        terraform workspace select dev || terraform workspace new dev
        terraform plan -var-file="terraform.tfvars.dev"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Validate dev environment
      run: |
        echo "Validating dev environment..."
        if [[ "${{ env.ENVIRONMENT }}" != "dev" ]]; then
          echo "❌ Expected dev environment, got ${{ env.ENVIRONMENT }}"
          exit 1
        fi
        if [[ ! -f "infra/terraform/terraform.tfvars.dev" ]]; then
          echo "❌ Missing terraform.tfvars.dev file"
          exit 1
        fi
        aws sts get-caller-identity
        echo "✅ Dev environment validation passed"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Deploy shared infrastructure first
      working-directory: infra/terraform/shared
      run: |
        terraform init -reconfigure
        terraform apply -auto-approve

    - name: Deploy dev infrastructure
      working-directory: infra/terraform
      run: |
        terraform init -reconfigure
        terraform workspace select dev || terraform workspace new dev
        terraform apply -var-file="terraform.tfvars.dev" -auto-approve

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push development image (with shell access)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest app/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest

    - name: Build and push production image (secure distroless, no shell)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -f app/Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest app/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest

    - name: Container Security Scan
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --severity HIGH,CRITICAL \
          --exit-code 1 \
          $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest || echo "⚠️ Container vulnerabilities found - review required"

    - name: Build and push Prometheus image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -f infra/Dockerfile.prometheus -t $ECR_REGISTRY/$ECR_REPOSITORY:prometheus infra/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:prometheus

    - name: Update ECS service with dev image
      working-directory: infra/terraform
      run: |
        terraform workspace select dev
        terraform apply -var-file="terraform.tfvars.dev" -auto-approve
        echo "✅ Dev deployed using dev-latest image (source: ${{ github.sha }})"
        echo "🔒 Secure prod-latest image ready for promotion"

    - name: Force ECS service updates
      env:
        AWS_REGION: ${{ env.AWS_REGION }}
        ENVIRONMENT: ${{ env.ENVIRONMENT }}
      run: |
        cd infra/terraform
        terraform workspace select $ENVIRONMENT
        CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
        MAIN_SERVICE=$(terraform output -raw main_service_name)
        PROMETHEUS_SERVICE=$(terraform output -raw prometheus_service_name)
        GRAFANA_SERVICE=$(terraform output -raw grafana_service_name)
        
        # Update main application service
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service $MAIN_SERVICE \
          --force-new-deployment \
          --region $AWS_REGION
        
        # Update Prometheus service if it exists
        if aws ecs describe-services --cluster $CLUSTER_NAME --services $PROMETHEUS_SERVICE --region $AWS_REGION >/dev/null 2>&1; then
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $PROMETHEUS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
        fi
        
        # Update Grafana service if it exists  
        if aws ecs describe-services --cluster $CLUSTER_NAME --services $GRAFANA_SERVICE --region $AWS_REGION >/dev/null 2>&1; then
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $GRAFANA_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
        fi

    - name: Get deployment URLs
      working-directory: infra/terraform
      run: |
        terraform workspace select dev
        echo "✅ Development deployment completed successfully!"
        echo "🌐 Application URL: $(terraform output -raw application_url)"
        echo "📊 CloudWatch Dashboard: $(terraform output -raw cloudwatch_dashboard_url)"
        echo "📈 Grafana Dashboard: $(terraform output -raw grafana_url)"
        echo "🔍 Prometheus Metrics: $(terraform output -raw prometheus_url)"
        echo "📷 Source commit: ${{ github.sha }}"
        echo "🔒 Images built: dev-latest (dev with shell), prod-latest (secure distroless for uat/prod)"