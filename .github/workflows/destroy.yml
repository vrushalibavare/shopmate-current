name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

env:
  AWS_REGION: ap-southeast-1

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Destroy Infrastructure
      working-directory: infra/terraform
      env:
        ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        terraform init -reconfigure
        terraform workspace select $ENVIRONMENT || terraform workspace new $ENVIRONMENT
        terraform destroy -var-file="terraform.tfvars.$ENVIRONMENT" -auto-approve
        echo "✅ $ENVIRONMENT environment destroyed successfully"

    - name: Summary
      run: |
        echo "🗑️ Infrastructure destroyed for environment: ${{ github.event.inputs.environment }}"
        echo "📝 Note: Shared resources (ECR, OIDC, DynamoDB) are preserved"
        echo "🔄 To destroy shared resources, use the 'Destroy Shared Infrastructure' workflow"