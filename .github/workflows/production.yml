# ============================================================================
# PRODUCTION DEPLOYMENT WORKFLOW
# ============================================================================
# This workflow deploys to the production environment using the reusable workflow
# 
# Purpose:
# - Promotes code from stage → production branch
# - Uses existing prod-latest image (built in dev workflow)
# - Applies GitHub environment protection for production approvals
# - Uses secure distroless image with debug capabilities
# 
# Triggered by: PR merge from stage to production branch
# Reusable workflow: deploy-reusable.yml
# Environment: prod (Production)
# Backend config: Fetched securely from Parameter Store
# ============================================================================

name: Deploy to Production

on:
  pull_request:
    branches: [ production ]
    types: [ closed ]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      source_branch: stage
      target_branch: production
      github_environment: production
    secrets: inherit